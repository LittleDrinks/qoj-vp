name: Hydro base image
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, build]
        default: probe
        description: Probe hosted virtualization or rebuild the reusable installed system
permissions:
  contents: read
concurrency:
  group: hydro-base-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check hosted virtualization
        run: |
          set -euo pipefail
          lscpu | head -25
          df -h /
          test -c /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          sudo python3 - <<'PY'
          import os,fcntl
          fd=os.open('/dev/kvm',os.O_RDWR)
          assert fcntl.ioctl(fd,0xAE00,0)==12
          vm=fcntl.ioctl(fd,0xAE01,0)
          os.close(vm);os.close(fd)
          print('KVM_CREATE_VM passed')
          PY
      - name: Probe upstream download access
        if: inputs.mode == 'probe'
        run: |
          curl -L -sS --max-time 10 -o /dev/null -w 'Full GET HTTP %{http_code} bytes %{size_download}\n' https://contest.hydro.org.cn/2026/ubuntu-24.04.5-icpc2026-amd64.iso || true
          curl -IL -sS --max-time 10 https://contest.hydro.org.cn/2026/ubuntu-24.04.5-icpc2026-amd64.iso || true
      - name: Prepare hosted disk space
        if: inputs.mode == 'build'
        run: bash ci/hydro/free-runner-space.sh
      - name: Import clean ISO once
        if: inputs.mode == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/hydro-source"
          gh release download hydro-ci-bootstrap-2026 --pattern 'hydro.iso.part-*' --pattern 'iso.json' --dir "$RUNNER_TEMP/hydro-source"
          digest=$(python3 ci/hydro/import-iso.py "$RUNNER_TEMP/hydro-source")
          test "$digest" = 150812711cef3a58e1da89d40748bdf7692a3ea8cc76c5e94a9f122d1a995931
          echo "HYDRO_ISO_SHA256=$digest" >> "$GITHUB_ENV"
          echo "HYDRO_ISO=$RUNNER_TEMP/hydro-source/hydro.iso" >> "$GITHUB_ENV"
      - name: Build installed Hydro image
        if: inputs.mode == 'build'
        run: sudo --preserve-env=HYDRO_ISO,HYDRO_ISO_SHA256,RUNNER_TEMP bash ci/hydro/build-image.sh
      - name: Sign in to GHCR
        if: inputs.mode == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish reusable system
        if: inputs.mode == 'build'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-hydro:2026-r1"
          docker build -t "$image" ci/hydro
          bash ci/hydro/test-image.sh "$image" smoke
          docker push "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain image build evidence
        if: always() && inputs.mode == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hydro-image-evidence
          path: |
            ci/hydro/output/*.json
            ci/hydro/output/packages.txt
            results/hydro-hosted/
          if-no-files-found: ignore
