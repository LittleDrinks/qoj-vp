name: Hydro base image
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, build]
        default: probe
        description: Probe hosted virtualization or rebuild the reusable installed system
      iso_url:
        type: string
        required: false
        description: Optional one-time HTTPS transport for the pinned clean ISO
      disk_run_id:
        type: string
        required: false
        description: Resume packaging from an existing hydro-installed-system artifact run ID
permissions:
  contents: read
concurrency:
  group: hydro-base-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      # GitHub requires push access to read unpublished release assets.
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check hosted virtualization
        run: |
          set -euo pipefail
          lscpu | head -25
          df -h /
          test -c /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          sudo python3 - <<'PY'
          import os,fcntl
          fd=os.open('/dev/kvm',os.O_RDWR)
          assert fcntl.ioctl(fd,0xAE00,0)==12
          vm=fcntl.ioctl(fd,0xAE01,0)
          os.close(vm);os.close(fd)
          print('KVM_CREATE_VM passed')
          PY
      - name: Probe ISO transport
        if: inputs.mode == 'probe' && inputs.iso_url != ''
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: curl --fail --location --max-time 90 --range 0-10485759 -o /dev/null -w 'HTTP %{http_code}, bytes/sec %{speed_download}\n' "$ISO_URL"
      - name: Prepare hosted disk space
        if: inputs.mode == 'build'
        run: bash ci/hydro/free-runner-space.sh
      - name: Import clean ISO once
        if: inputs.mode == 'build' && inputs.disk_run_id == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISO_URL: ${{ inputs.iso_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/hydro-source"
          digest=150812711cef3a58e1da89d40748bdf7692a3ea8cc76c5e94a9f122d1a995931
          if [ -n "$ISO_URL" ]; then
            sudo apt-get install -y --no-install-recommends aria2
            aria2c --allow-overwrite=true --file-allocation=none --max-connection-per-server=16 --split=16 --min-split-size=16M --timeout=60 --max-tries=5 --summary-interval=30 --dir="$RUNNER_TEMP/hydro-source" --out=hydro.iso "$ISO_URL"
          else
            gh release download hydro-ci-bootstrap-2026 --pattern 'hydro.iso.part-*' --pattern 'iso.json' --dir "$RUNNER_TEMP/hydro-source"
            actual=$(python3 ci/hydro/import-iso.py "$RUNNER_TEMP/hydro-source")
            test "$actual" = "$digest"
          fi
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/hydro-source/hydro.iso" | sha256sum --check
          echo "HYDRO_ISO_SHA256=$digest" >> "$GITHUB_ENV"
          echo "HYDRO_ISO=$RUNNER_TEMP/hydro-source/hydro.iso" >> "$GITHUB_ENV"
      - name: Build installed Hydro image
        if: inputs.mode == 'build' && inputs.disk_run_id == ''
        run: sudo --preserve-env=HYDRO_ISO,HYDRO_ISO_SHA256,RUNNER_TEMP bash ci/hydro/build-image.sh
      - name: Cache installed system for packaging retries
        if: inputs.mode == 'build' && inputs.disk_run_id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hydro-installed-system
          path: ci/hydro/output/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Restore installed system
        if: inputs.mode == 'build' && inputs.disk_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: hydro-installed-system
          path: ci/hydro/output
          run-id: ${{ inputs.disk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify readable build context
        if: inputs.mode == 'build'
        working-directory: ci/hydro/output
        run: sha256sum --check SHA256SUMS
      - name: Sign in to GHCR
        if: inputs.mode == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "HYDRO_RUNTIME_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-hydro:2026-r1" >> "$GITHUB_ENV"
      - name: Build runtime container
        if: inputs.mode == 'build'
        run: docker build -t "$HYDRO_RUNTIME_IMAGE" ci/hydro
      - name: Verify guest boot, reboot and Firefox
        if: inputs.mode == 'build'
        run: bash ci/hydro/test-image.sh "$HYDRO_RUNTIME_IMAGE" smoke
      - name: Publish reusable system
        if: inputs.mode == 'build'
        run: |
          docker push "$HYDRO_RUNTIME_IMAGE"
          docker image inspect "$HYDRO_RUNTIME_IMAGE" --format '{{json .RepoDigests}}' > ci/hydro/output/registry.json
          cat ci/hydro/output/registry.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain image build evidence
        if: always() && inputs.mode == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hydro-image-evidence
          path: |
            ci/hydro/output/*.json
            ci/hydro/output/packages.txt
            results/hydro-hosted/
          if-no-files-found: ignore
