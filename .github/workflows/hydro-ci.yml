name: Hydro Firefox regression

on:
  workflow_dispatch:
    inputs:
      check_rankland_online:
        description: Also check the current public RankLand page in an isolated test replay
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hydro-firefox
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check dedicated runner registration
        env:
          HYDRO_CI_ENABLED: ${{ vars.HYDRO_CI_ENABLED }}
          REQUESTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$HYDRO_CI_ENABLED" != 'true' ]; then
            echo '::error::Register the dedicated Hydro runner and set HYDRO_CI_ENABLED=true.'
            exit 1
          fi
          if [ "$REQUESTED_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo '::error::Hydro CI runs only the repository default branch.'
            exit 1
          fi

  firefox:
    needs: availability
    runs-on: [self-hosted, Linux, X64, hydro-contest-os-2026]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install isolated browser-test dependencies
        run: /usr/bin/python3 -m pip install --target tests/browser/vendor_py . 'selenium>=4.27,<5'
      - name: Install verified geckodriver
        run: |
          mkdir -p tests/browser/tools
          curl --fail --location --retry 3 --max-time 120 https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz --output tests/browser/tools/geckodriver-v0.37.1-linux64.tar.gz
          printf '%s  %s\n' 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e' 'tests/browser/tools/geckodriver-v0.37.1-linux64.tar.gz' | sha256sum --check
          tar -xzf tests/browser/tools/geckodriver-v0.37.1-linux64.tar.gz -C tests/browser/tools geckodriver
      - name: Run isolated Firefox regressions
        env:
          CHECK_RANKLAND_ONLINE: ${{ inputs.check_rankland_online }}
        run: |
          task_arguments=()
          if [ "$CHECK_RANKLAND_ONLINE" = 'true' ]; then
            task_arguments+=(--rankland-online)
          fi
          /usr/bin/python3 scripts/run_hydro_ci.py "${task_arguments[@]}"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hydro-firefox-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            results/**/*.json
            results/**/*.png
            results/ci/*.txt
          if-no-files-found: warn
          retention-days: 14
