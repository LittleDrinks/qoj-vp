name: Prepare Hydro runtime
description: Restore the verified Hydro disk and its small QEMU container
inputs:
  token:
    description: GitHub token with packages read permission
    required: true
runs:
  using: composite
  steps:
    - name: Prepare disposable hosted runner
      shell: bash
      run: |
        test -c /dev/kvm
        bash infra/hydro/free-runner-space.sh 24
    - name: Read pinned Hydro images
      id: image
      shell: bash
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json,re
        config=json.load(open('infra/hydro/image.json'))
        for key in ('image','runtime'):
            assert re.fullmatch(r'ghcr.io/littledrinks/qoj-vp-hydro@sha256:[a-f0-9]{64}',config[key])
            print(f'{key}={config[key]}')
        print('disk='+config['image'].split(':')[-1])
        PY
    - name: Restore preinstalled Hydro disk
      id: disk-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/hydro-guest
        key: hydro-guest-v1-${{ steps.image.outputs.disk }}
    - name: Pull pinned runtime and seed missing disk cache
      env:
        GH_TOKEN: ${{ inputs.token }}
        IMAGE: ${{ steps.image.outputs.image }}
        RUNTIME: ${{ steps.image.outputs.runtime }}
        CACHE_HIT: ${{ steps.disk-cache.outputs.cache-hit }}
      shell: bash
      run: |
        printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
        if [ "$CACHE_HIT" != true ]; then
          docker pull "$IMAGE"
          container=$(docker create "$IMAGE")
          mkdir -p "$RUNNER_TEMP/hydro-guest"
          docker cp "$container:/opt/hydro/." "$RUNNER_TEMP/hydro-guest/"
          docker rm "$container"
          printf '%s\n' "$IMAGE" > "$RUNNER_TEMP/hydro-guest/source-image"
          docker image rm "$IMAGE"
        fi
        docker pull "$RUNTIME"
        docker tag "$RUNTIME" hydro-ci:cached
    - name: Verify cached disk contents
      env:
        IMAGE: ${{ steps.image.outputs.image }}
      shell: bash
      run: |
        test "$(cat "$RUNNER_TEMP/hydro-guest/source-image")" = "$IMAGE"
        (cd "$RUNNER_TEMP/hydro-guest" && sha256sum --check SHA256SUMS)
        echo "HYDRO_GUEST_DIR=$RUNNER_TEMP/hydro-guest" >> "$GITHUB_ENV"
    - name: Cache verified preinstalled disk
      if: steps.disk-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/hydro-guest
        key: ${{ steps.disk-cache.outputs.cache-primary-key }}
