<div class="modal fade" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    Submit                 </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
                            <form name="submit_problem" method="post" action="/team/submit" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3"><label for="submit_problem_code" class="form-label required">Source file</label>        <input type="file" id="submit_problem_code" name="submit_problem[code]" required="required" class="form-control" />    </div>
                    <div class="alert d-none" id="files_selected"></div>
                    <div class="mb-3"><label class="form-label required" for="submit_problem_problem">Problem</label><select id="submit_problem_problem" name="submit_problem[problem]" required="required" class="form-control form-select form-select"><option value="" selected="selected">Select a problem</option><option value="4">A - Bridge</option><option value="5">B - Cells Coloring</option><option value="6">C - Clone Ranran</option><option value="7">D - Contests</option><option value="8">E - Find Maximum</option><option value="9">F - Hotel</option><option value="10">G - Perfect Word</option><option value="11">H - Power of Two</option><option value="12">I - Square Grid</option><option value="13">J - Strange Sum</option><option value="14">K - Streets</option><option value="15">L - Tree</option></select></div>
                    <div class="mb-3"><label class="form-label required" for="submit_problem_language">Language</label><select id="submit_problem_language" name="submit_problem[language]" required="required" class="form-control form-select form-select"><option value="" selected="selected">Select a language</option><option value="c">C</option><option value="cpp">C++</option><option value="java">Java</option><option value="py3">Python 3</option></select></div>
                    <div data-entry-point="" class="mb-3"><label for="submit_problem_entry_point" class="form-label">Entry point</label>        <input type="text" id="submit_problem_entry_point" name="submit_problem[entry_point]" aria-describedby="submit_problem_entry_point_help" class="form-control" />    <div id="submit_problem_entry_point_help" class="form-text mb-0 help-text">The entry point for your code.</div></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn-success btn">
                        <i class="fas fa-cloud-upload-alt"></i> Submit
                    </button>
                </div>
                        <input type="hidden" id="submit_problem__token" name="submit_problem[_token]" value="CSRF_TOKEN_REDACTED" />    </form>
                    </div>
    </div>

    <script>
        const fileInput = document.getElementById('submit_problem_code');
        fileInput.addEventListener('change', (event) => {
            const filenameRegex = /^[a-zA-Z0-9_][a-zA-Z0-9+_\.-]*$/;
            const five_minutes_in_ms = 5 * 60 * 1000;
            const now = Date.now();
            filesSelected = $('#files_selected');
            filesSelected.addClass('d-none');

            var fileInfoHtml = '';
            const files = event.target.files;
            atLeastOneFileRecent = false;
            for (let file of files) {
                const date = new Date(file.lastModified);
                const ago = humanReadableTimeDiff((now - date)/1000) + ' ago';
                if(date > now - five_minutes_in_ms) {
                    atLeastOneFileRecent = true;
                }
                fileValidChars = file.name.match(filenameRegex);
                size = humanReadableBytes(file.size);

                className = '';
                message = `size ${size}`;
                message += `, last modified ${ago}`;
                if(!fileValidChars) {
                    className = 'bg-danger';
                    message += ', invalid filename';
                }
                if(file.size == 0) {
                    className = 'bg-warning';
                    message += ', empty file';
                }
                fileInfoHtml += `<li class="${className}"><span class="filename">${file.name}</span> ${message}</li>`;
            }
            result = '<ul>' + fileInfoHtml + '</ul>';
            if(!atLeastOneFileRecent) {
                result += '<div class="alert alert-warning">None of the selected files have been recently modified</div>';
            }
            filesSelected.html(result);
            filesSelected.removeClass('d-none');
        });
    </script>
</div>
