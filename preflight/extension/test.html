<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QOJ VP 前置测试</title>
  <link rel="stylesheet" href="test.css">
  <script src="test.js" defer></script>
</head>
<body>
  <h1>QOJ VP 前置测试</h1>
  <p>隔离测试页：验证 Firefox、按需 Python、会话持久化及只读 QOJ 请求。</p>
  <p id="health" role="status">正在连接按需助手……</p>
  <fieldset>
    <legend>只读数据来源</legend>
    <label>比赛 ID <input id="contest" value="90001"></label>
    <label>题号 <input id="problem" value="A"></label>
    <label>本地 fixture origin（留空读取真实 QOJ）<input id="fixture" value="http://127.0.0.1:8765"></label>
    <button id="read-samples">读取题表与单题 samples</button>
    <button id="read-form">只读检查提交表单</button>
  </fieldset>
  <fieldset>
    <legend>无需后台常驻的会话恢复</legend>
    <button id="create-session">创建已开始两小时的测试会话</button>
    <button id="list-sessions">查看持久会话</button>
    <button id="hello">查询新助手 PID</button>
  </fieldset>
  <a id="download" hidden>下载本题 samples ZIP</a>
  <pre id="result" aria-live="polite"></pre>
</body>
</html>
