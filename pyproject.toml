[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qoj-vp-workbench"
version = "0.4.0"
description = "QOJ workbench with DOMjudge team pages and local historical scoreboard replay"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "pycurl>=7.45"]
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["qojvp*"]
